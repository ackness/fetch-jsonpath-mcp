# Release workflow: tag push `v*` -> verify -> build -> publish to PyPI -> GitHub release.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens needed.
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/ or the
# project's publishing settings):
#   Owner:          ackness
#   Repository:     fetch-jsonpath-mcp
#   Workflow name:  release.yml
#   Environment:    pypi
#
# To release: bump `version` in pyproject.toml, push a matching tag:
#   git tag v1.2.0 && git push origin v1.2.0

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.0)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Verify tag matches project version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag '${TAG}' does not match pyproject.toml version '${version}'"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fetch-jsonpath-mcp
    permissions:
      id-token: write  # OIDC token exchange for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
